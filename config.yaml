# Dream2Image (ES606) — single source of truth for every parameter.
# Decisions marked [verified Oct 2026] were checked against the data in the first local
# pipeline (Desktop/Sem 3/Dream2Image, Step 0) and are re-checked by notebooks/01_data.ipynb.

seed: 20251006

dataset:
  hf_id: opsecsystems/Dream2Image
  # The repo holds the same rows twice (data/*.parquet shards and train/data.parquet);
  # only the shards are downloaded.
  parquet_glob: data/train-*.parquet
  expected_n_rows: 129
  name_col: title
  total_col: eeg_120s
  window_cols: {15: eeg_15s, 30: eeg_30s, 60: eeg_60s}
  text_cols: [transcription, description]
  image_col: image              # never loaded: DALL-E 3 renders of the transcripts, no brain information
  sfreq: 400.0
  # [verified Oct 2026] order is spatially plausible: corr-vs-distance rho = 0.87, perm p < 0.001
  channels: [C3, C4, Cz, F3, F4, F7, F8, Fp1, Fp2, Fpz, Fz, O1, O2, Oz, P3, P4, Pz]
  dead_sd_floor: 1.0e-6         # channel SD below this over the total = dead (all zeros)

participant:
  expected_n: 38                # paper's count; NB1 asserts the parsed count against it

checks:
  zscore_mean_tol: 0.05
  zscore_sd_tol: 0.05
  identical_atol: 1.0e-6
  affine_min_r: 0.999
  misaligned_stop_fraction: 0.10
  n_perm_channel_order: 5000
  primary_channel_min_frac: 0.95   # channel enters the primary set if live in >= this fraction of retained samples
  scaling_flag_sd: 0.25            # flag sample if any primary epoch has median channel SD below this (sensitivity only)
  psd_win_s: 4.0

exclusions:
  drop_nesting_misaligned: true
  drop_channel_count_not: 17

# Epochs, seconds relative to awakening; each epoch = last 15 s of its bin.
epochs:
  E1: [-120, -60]               # only the 'case' site has 120 s -> exploratory
  E2: [-60, -30]
  E3: [-30, -15]
  E4: [-15, 0]
  epoch_len_s: 15.0
  primary_epochs: [E2, E3, E4]

# NB2 preprocessing, carried over from the Oct 2026 pipeline (each choice checked there).
# Order per sample: filter -> sample-level bad channels -> interpolate -> reference -> robust scale;
# then per epoch: same filter -> channel-in-epoch bads -> interpolate -> reference -> sub-window rejection.
preprocess:
  drop_channels: [Cz]           # dead in every 'subject'-site recording
  band: [0.5, 30.0]             # shared by both sites; above ~40 Hz the sites differ (NB1 section 7)
  filter_pad: mean              # edge error on real epochs: 0.01 with mean padding vs 0.30 with reflect_limited
  average_reference: true       # data were z-scored after an unknown reference: a re-reference, not a true average
  bad_neighbor_r_min: 0.4       # sample-level bad channel: mean r with 3 nearest neighbours below this
  reject_subwin_s: 2.0
  # thresholds in robust units: 1.4826*MAD per sample x channel over the whole filtered recording, so
  # every epoch of a sample faces the same threshold (E4 carries pre-waking movement; per-epoch scaling
  # would give it a laxer threshold and bias E4-vs-E2)
  ptp_threshold: 10.0
  flat_threshold: 0.01
  gradient_threshold: 5.0
  channel_epoch_bad_frac: 0.5   # channel failing > this fraction of an epoch's sub-windows -> interpolate it
  max_interp_frac: 0.25         # epoch with more interpolated channels -> unusable

# NB3 features. Methods: Siclari et al. 2017 (pre-awakening posterior low-frequency power),
# Donoghue et al. 2020 (specparam: aperiodic exponent separated from oscillatory peaks).
features:
  # 2-s segments (0.5 Hz resolution), 1-s step: 14 segments per 15-s epoch. With 4-s segments one rejected
  # 2-s sub-window removes two of only six segments: complete E2-E4 samples drop from 109 to 76.
  welch_win_s: 2.0
  welch_overlap_s: 1.0          # step between segment starts
  min_clean_segments: 4         # >= 5 s of clean signal; fewer -> features NaN
  bands: {delta: [1, 4], theta: [4, 8], alpha: [8, 12], sigma: [12, 16], beta: [16, 30]}
  specparam_range: [1, 30]
  specparam: {peak_width_limits: [1, 8], max_n_peaks: 4, min_peak_height: 0.1, aperiodic_mode: fixed}
  min_r2: 0.8                   # fits below this -> exponent NaN
  posterior_roi: [O1, O2, Oz, P3, P4, Pz]   # Siclari et al. 2017 posterior "hot zone", as far as 16 channels allow

# NB4: H1 and RQ3. Fixed before looking at any test result.
h1:
  epochs: [E2, E3, E4]          # all retained samples have these; E1 (case site only) is exploratory
  primary: [logpow_delta, ap_exponent]   # posterior ROI; H1 predicts both fall toward awakening
  covariates: [site, reject_rate]        # also refit without reject_rate: pre-waking movement may be part of the effect
  alpha: 0.05                   # Holm across the two primary tests; FDR (BH) for the exploratory channel map

# NB5: H2. Fixed before looking at any decoding result.
h2:
  epochs: [E2, E3, E4]
  features: [logpow_delta, logpow_theta, logpow_alpha, logpow_sigma, logpow_beta, ap_exponent, ap_offset]
  text_model: sentence-transformers/all-mpnet-base-v2
  alphas: [0.1, 1, 10, 100, 1000, 10000, 100000]
  n_perm: 1000
  tost_bound: 0.05              # equivalence bound on the E4 - E2 rank-accuracy difference

paths:                          # relative to the data root (Drive on Colab, D2I_DATA locally)
  hf: hf
  raw: raw
  derived: derived
  results: results
